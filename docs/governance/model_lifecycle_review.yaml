module: "Model Lifecycle Review"
version: 0.1
entities:
  - model_id
  - owner_agent
  - version
  - training_data_refs
states:
  - Active
  - Candidate
  - Deprecated
  - HeldForReview
transitions:
  - from: Candidate
    to: Active
    requires:
      - "eval_pass >= policy.thresholds.eval_pass"
      - "bias_check_pass == true"
      - "dual_quorum_signoff == true"
  - from: Active
    to: Deprecated
    requires:
      - dual_quorum_signoff
  - from: Active
    to: HeldForReview
    requires:
      - anomaly_review_triggered
policy:
  thresholds:
    eval_pass: 0.80
    drift_alert_review: 80
  retrain:
    allow: true
    requires:
      - reproducible_recipe
      - governance_ticket
audit:
  anchor_model_lineage: true
  public_cards: true
notes: >
  Model state transitions should be reviewable through documented governance procedures.
