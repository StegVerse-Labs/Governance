name: Bootstrap StegTrace

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: bootstrap-stegtrace
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No secret is read. The StegTrace write is TVC's broker operations
      # APPLY_BOUNDED_FILE_SET then OPEN_PULL_REQUEST (a TV/TVC transition);
      # this step emits their non-secret request and fails closed with the six fields.
      - name: Emit the TV/TVC broker request (fails closed; no credential)
        run: python scripts/bootstrap_stegtrace.py

      - name: Upload inspectable bootstrap receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stegtrace-bootstrap-receipt
          path: evidence/stegtrace-bootstrap/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist changed receipt
        if: always()
        run: |
          if git diff --quiet -- evidence/stegtrace-bootstrap/latest.json; then
            exit 0
          fi
          git config user.name "governance-stegtrace-bootstrap-bot"
          git config user.email "governance-stegtrace-bootstrap-bot@users.noreply.github.com"
          git add evidence/stegtrace-bootstrap/latest.json
          git commit -m "Record StegTrace bootstrap state [skip ci]"
          git push
