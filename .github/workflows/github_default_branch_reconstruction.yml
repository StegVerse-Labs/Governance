name: GitHub Default Branch Reconstruction

on:
  push:
    branches: [main, agent/metered-platform-replacement]
    paths:
      - 'scripts/verify_github_default_branch_reconstruction.py'
      - '.github/workflows/github_default_branch_reconstruction.yml'
  pull_request:
    paths:
      - 'scripts/verify_github_default_branch_reconstruction.py'
      - '.github/workflows/github_default_branch_reconstruction.yml'
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: github-default-branch-reconstruction
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify authenticated read-only reconstruction
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_github_default_branch_reconstruction.py
      - name: Enforce bounded zero-authority evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open('reports/github-default-branch-reconstruction.json'))
          assert d['scope'] == 'default_branch_snapshot_only'
          assert d['history_complete'] is False
          assert d['source_content_retained'] is False
          assert d['source_content_uploaded'] is False
          assert d['temporary_source_destroyed'] is True
          forbidden=('manual_action_required','production_mutation_allowed','execution_authority','traffic_cutover_authority','cancellation_authority','provider_retirement_authority','continuity_receipt_minted')
          for field in forbidden:
              assert d[field] is False, field
          for record in d['records']:
              for field in forbidden:
                  assert record[field] is False, (record['repository'], field)
              assert record['temporary_source_destroyed'] is True
              assert record['source_content_retained'] is False
              assert record['source_content_uploaded'] is False
          PY
      - name: Upload hash-only reconstruction evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-default-branch-reconstruction
          path: reports/github-default-branch-reconstruction.json
      - name: Reconcile automated reconstruction blockers
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT="$(python - <<'PY'
          import json
          d=json.load(open('reports/github-default-branch-reconstruction.json'))
          print(d['blocked_repository_count'])
          PY
          )"
          TITLE='[automation] GitHub default-branch reconstruction blockers'
          NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "$TITLE in:title" --json number --jq '.[0].number // empty')"
          BODY="Machine-owned read-only reconstruction reports ${COUNT} blocked repository(s). Evidence contains hashes only; temporary source and archives are destroyed. No manual credential handling, production mutation, cutover, cancellation, retirement, or receipt authority is granted."
          if [ "$COUNT" -gt 0 ]; then
            if [ -n "$NUMBER" ]; then gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"; gh issue reopen "$NUMBER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true; else gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"; fi
          elif [ -n "$NUMBER" ]; then
            gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed --comment 'All accessible repositories pass default-branch reconstruction proof.' >/dev/null 2>&1 || true
          fi
