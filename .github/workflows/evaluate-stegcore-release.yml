name: Evaluate StegCore Release Policy
# Candidate binding refresh trigger: 2026-08-08T15:08Z

on:
  push:
    branches: [main]
    paths:
      - 'policies/stegcore-release-policy-v1.json'
      - 'scripts/evaluate_stegcore_release.py'
      - '.github/workflows/evaluate-stegcore-release.yml'
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch: {}

concurrency:
  group: governance-stegcore-release-policy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Governance
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acquire StegCore candidate and evidence without adding credential authority
        id: acquire
        run: |
          set -u
          mkdir -p "${RUNNER_TEMP}/stegcore/evidence"
          BASE="https://raw.githubusercontent.com/StegVerse-Labs/StegCore/main"
          missing=()
          for path in \
            evidence/release-candidate-request.json \
            evidence/runtime-validation.json \
            evidence/release-readiness.json \
            evidence/downstream-verification-results.json \
            evidence/governance-freshness.json \
            pyproject.toml
          do
            target="${RUNNER_TEMP}/stegcore/${path}"
            mkdir -p "$(dirname "$target")"
            if ! curl --fail --silent --show-error --location "$BASE/$path" -o "$target"; then
              rm -f "$target"
              missing+=("$path")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
            printf 'missing=%s\n' "$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
            echo "StegCore release evidence is not anonymously readable: ${missing[*]}"
          else
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
            printf 'missing=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate independent release policy
        if: steps.acquire.outputs.available == 'true'
        continue-on-error: true
        run: |
          python scripts/evaluate_stegcore_release.py \
            --policy policies/stegcore-release-policy-v1.json \
            --candidate "${RUNNER_TEMP}/stegcore/evidence/release-candidate-request.json" \
            --runtime "${RUNNER_TEMP}/stegcore/evidence/runtime-validation.json" \
            --readiness "${RUNNER_TEMP}/stegcore/evidence/release-readiness.json" \
            --downstream "${RUNNER_TEMP}/stegcore/evidence/downstream-verification-results.json" \
            --freshness "${RUNNER_TEMP}/stegcore/evidence/governance-freshness.json" \
            --pyproject "${RUNNER_TEMP}/stegcore/pyproject.toml" \
            --repository-url https://github.com/StegVerse-Labs/StegCore.git \
            --output evidence/stegcore-release-decision.json

      - name: Record fail-closed evidence acquisition boundary
        if: steps.acquire.outputs.available != 'true'
        env:
          MISSING: ${{ steps.acquire.outputs.missing }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          policy = json.loads(Path('policies/stegcore-release-policy-v1.json').read_text())
          missing = [item for item in os.environ.get('MISSING', '').split(',') if item]
          artifact = {
              'artifact_type': 'governance.release_decision',
              'schema_version': '1.0',
              'policy_id': policy.get('policy_id'),
              'decision_owner': policy.get('decision_owner'),
              'subject_repository': 'StegVerse-Labs/StegCore',
              'candidate_version': None,
              'candidate_tag': None,
              'candidate_commit': None,
              'decision': 'FAIL-CLOSED',
              'checks': {
                  'evidence_acquisition': {
                      'status': 'fail',
                      'observed': {
                          'missing_or_inaccessible': missing,
                          'credential_escalation_attempted': False,
                          'anonymous_raw_boundary_only': True,
                      },
                  }
              },
              'reasons': ['required StegCore release evidence was not readable at the configured non-credentialed acquisition boundary'],
              'evaluated_at': datetime.now(timezone.utc).isoformat(),
              'next_permitted_action': 'restore a TV/TVC-governed evidence projection or other authorized repository-readable transfer, then re-evaluate',
              'authority_boundary': policy.get('authority_boundary'),
              'release_created': False,
              'tag_created': False,
              'deployment_authorized': False,
              'continuity_receipt_minted': False,
          }
          canonical = json.dumps(artifact, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          artifact['decision_hash'] = hashlib.sha256(canonical.encode()).hexdigest()
          Path('evidence').mkdir(exist_ok=True)
          Path('evidence/stegcore-release-decision.json').write_text(json.dumps(artifact, indent=2, sort_keys=True) + '\n')
          print('FAIL-CLOSED: required StegCore release evidence is inaccessible without credential escalation')
          PY

      - name: Resolve decision output
        id: decision
        run: |
          echo "decision=$(python -c "import json; print(json.load(open('evidence/stegcore-release-decision.json'))['decision'])")" >> "$GITHUB_OUTPUT"

      - name: Validate decision artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('evidence/stegcore-release-decision.json').read_text())
          assert value['decision'] in {'ALLOW', 'DENY', 'FAIL-CLOSED'}
          assert value['release_created'] is False
          assert value['tag_created'] is False
          assert value['deployment_authorized'] is False
          assert value['continuity_receipt_minted'] is False
          assert value['authority_boundary']['allow_decision_is_tag_creation'] is False
          PY

      - name: Persist changed decision
        run: |
          if git diff --quiet -- evidence/stegcore-release-decision.json && git ls-files --error-unmatch evidence/stegcore-release-decision.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "governance-release-policy-bot"
          git config user.email "governance-release-policy-bot@users.noreply.github.com"
          git add evidence/stegcore-release-decision.json
          git commit -m "Record independent StegCore release decision [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            test "$attempt" -eq 3 && exit 1
            sleep $((attempt * 2))
          done

      - name: Reconcile release-policy issue
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.decision.outputs.decision }}
        run: |
          TITLE="[release-policy] StegCore v0.1.0"
          BODY="Independent Governance release-policy decision: ${DECISION}. Durable artifact: evidence/stegcore-release-decision.json. An ALLOW permits only creation of the declared annotated tag; it does not create the tag, release, deployment, continuity receipt, or execution authority."
          NUMBER="$(gh issue list --state all --search 'StegCore v0.1.0 in:title' --json number --jq '.[0].number // empty')"
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body "$BODY"
          else
            NUMBER="$(gh issue create --title "$TITLE" --body "$BODY" --json number --jq '.number')"
          fi
          if [ "$DECISION" = "ALLOW" ]; then
            gh issue close "$NUMBER" --reason completed --comment "All independent release-policy gates passed. Tag creation remains a separate bounded action."
          else
            gh issue reopen "$NUMBER" >/dev/null 2>&1 || true
          fi

      - name: Fail workflow on denied decision
        if: steps.decision.outputs.decision != 'ALLOW'
        run: exit 1
