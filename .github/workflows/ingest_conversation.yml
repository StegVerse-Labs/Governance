name: Ingest Full Conversation (auto-split and index)

on:
  workflow_dispatch:
    inputs:
      title:
        description: "Overall title, for example StegVerse conversation"
        required: true
      content:
        description: "Paste the entire conversation here as markdown or plain text"
        required: true
      section_hint:
        description: "Optional delimiter, for example ### or --- section:"
        required: false
  push:
    branches:
      - main
    paths:
      - 'incoming/conversations/**.md'
      - 'incoming/conversations/**.txt'
      - 'scripts/ingest_conversation.py'
      - '.github/workflows/ingest_conversation.yml'

permissions:
  contents: write

concurrency:
  group: governance-conversation-ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare folders
        run: mkdir -p docs/conversations incoming/conversations

      - name: Ingest workflow-dispatch content
        if: github.event_name == 'workflow_dispatch'
        env:
          TITLE: ${{ github.event.inputs.title }}
          RAW: ${{ github.event.inputs.content }}
          HINT: ${{ github.event.inputs.section_hint }}
        run: |
          python scripts/ingest_conversation.py \
            --title "$TITLE" \
            --content "$RAW" \
            --section-hint "$HINT" \
            --output-dir docs/conversations

      - name: Ingest repository inbox
        if: github.event_name == 'push'
        run: |
          python scripts/ingest_conversation.py \
            --input-dir incoming/conversations \
            --output-dir docs/conversations

      - name: Remove consumed inbox records
        if: github.event_name == 'push'
        run: find incoming/conversations -maxdepth 1 -type f \( -name '*.md' -o -name '*.txt' \) -delete

      - name: Commit and push generated records
        run: |
          git config user.name "governance-ingestion-bot"
          git config user.email "governance-ingestion-bot@users.noreply.github.com"
          git add docs/conversations incoming/conversations
          if ! git diff --cached --quiet; then
            git commit -m "Ingest Governance conversation records"
            git push
          else
            echo "No generated conversation changes to commit."
          fi
