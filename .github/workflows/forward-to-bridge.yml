name: Forward PR to StegVerse AI Bridge [CONTAINED — TV/TVC AUTHORITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contained:
    runs-on: ubuntu-latest
    steps:
      - name: Block stale bridge dispatch
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy forwarder is contained because it used a generic non-TV/TVC credential and targeted the superseded StegVerse/hybrid-collab-bridge repository path."
          echo "Any future review transport must be bound to current repository identity and admitted TV/TVC route authority; it may not grant Governance execution authority."
          exit 1
