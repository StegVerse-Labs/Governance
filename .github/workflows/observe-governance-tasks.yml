name: Observe Governance Tasks - Hosted Guard Only

on:
  workflow_dispatch:

permissions: {}

jobs:
  hosted-observer-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Prove hosted surface is non-authorizing and non-executing
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"
          echo "HOSTED_GOVERNANCE_TASK_OBSERVER_DISABLED_TV_TVC_ONLY"
          echo "This workflow does not checkout source, execute Governance tasks, persist receipts, schedule work, or grant repository/runtime authority."
          echo "Canonical continuation is the sovereign Governance task observer handoff and central WorkerCoordinator path."
