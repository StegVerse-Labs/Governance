name: Validate Governance Docs

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'GOVERNANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/validate_docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'GOVERNANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/validate_docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML and required docs
        run: |
          python - <<'PY'
          import pathlib
          import sys
          try:
              import yaml
          except ImportError:
              print('Installing PyYAML is required for this workflow environment.')
              sys.exit(1)

          required = [
              'GOVERNANCE_MIRROR_HANDOFF.md',
              'docs/INDEX.md',
              'docs/governance/index.md',
              'docs/governance/constitution.yaml',
              'docs/governance/change_classes.yaml',
              'docs/governance/dual_quorum_protocol.yaml',
              'docs/governance/drift_monitor.yaml',
              'docs/governance/predictive_drift.yaml',
              'docs/governance/anchoring_policy.yaml',
              'docs/governance/internal_credit_policy.yaml',
              'docs/governance/model_lifecycle_review.yaml',
              'docs/governance/did_identity_policy.yaml',
              'docs/governance/ethical_dividend_policy.yaml',
              'docs/governance/adaptive_governance.yaml',
              'docs/governance/plugin_registry_policy.yaml',
              'docs/governance/ai_citizenship_charter.md',
              'docs/policies/risk_register.md',
          ]
          missing = [p for p in required if not pathlib.Path(p).exists()]
          if missing:
              print('Missing required files:')
              for p in missing:
                  print('-', p)
              sys.exit(1)

          for path in pathlib.Path('docs/governance').glob('*.yaml'):
              try:
                  yaml.safe_load(path.read_text())
              except Exception as exc:
                  print(f'YAML validation failed for {path}: {exc}')
                  sys.exit(1)

          print('Governance docs validation passed.')
          PY

      - name: Validate Markdown references are non-empty
        run: |
          test -s docs/INDEX.md
          test -s docs/governance/index.md
          test -s GOVERNANCE_MIRROR_HANDOFF.md
