name: Validate Governance Docs

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'automation/**'
      - 'scripts/validate_docs.py'
      - 'scripts/validate_gdr_examples.py'
      - 'scripts/validate_external_evidence_interop.py'
      - 'scripts/validate_relationship_outcomes.py'
      - 'scripts/run_governance_tasks.py'
      - 'scripts/ingest_conversation.py'
      - 'scripts/test_ingest_conversation.py'
      - 'GOVERNANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/validate_docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'automation/**'
      - 'scripts/validate_docs.py'
      - 'scripts/validate_gdr_examples.py'
      - 'scripts/validate_external_evidence_interop.py'
      - 'scripts/validate_relationship_outcomes.py'
      - 'scripts/run_governance_tasks.py'
      - 'scripts/ingest_conversation.py'
      - 'scripts/test_ingest_conversation.py'
      - 'GOVERNANCE_MIRROR_HANDOFF.md'
      - '.github/workflows/validate_docs.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate governance docs
        run: python scripts/validate_docs.py

      - name: Validate GDR examples and three-layer invariants
        run: python scripts/validate_gdr_examples.py

      - name: Validate external evidence interoperability
        run: python scripts/validate_external_evidence_interop.py

      - name: Validate relationship and outcome governance
        run: python scripts/validate_relationship_outcomes.py

      - name: Validate repository task registry
        run: python scripts/run_governance_tasks.py --validate-only

      - name: Smoke-test conversation ingestion
        run: python scripts/test_ingest_conversation.py
