name: Provider Inventory Collectors

on:
  push:
    paths:
      - 'data/external_dependency_registry.json'
      - 'scripts/build_provider_inventory_queue.py'
      - 'scripts/run_provider_inventory_collectors.py'
      - '.github/workflows/provider_inventory_collectors.yml'
  pull_request:
    paths:
      - 'data/external_dependency_registry.json'
      - 'scripts/build_provider_inventory_queue.py'
      - 'scripts/run_provider_inventory_collectors.py'
      - '.github/workflows/provider_inventory_collectors.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build provider inventory queue
        run: python scripts/build_provider_inventory_queue.py
      - name: Run provider collectors
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_provider_inventory_collectors.py
      - name: Verify deterministic blocked and collected records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp reports/provider-inventory-results.json /tmp/provider-inventory-results.json
          python scripts/run_provider_inventory_collectors.py
          cmp reports/provider-inventory-results.json /tmp/provider-inventory-results.json
      - name: Persist provider inventory evidence on main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "stegverse-provider-inventory-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/provider-inventory-queue.json reports/provider-inventory-results.json
          git diff --cached --quiet || git commit -m "Update provider inventory evidence [skip ci]"
          git push
